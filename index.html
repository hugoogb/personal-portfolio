    <script>
      /* Applied before first paint, so the prerendered page never flashes the
         wrong theme or accent on its way to the visitor's saved ones. React
         reads both back rather than deciding again. */
      (function () {
        try {
          var stored = localStorage.getItem("isDarkMode");
          var dark =
            stored === "true" ||
            (stored === null && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");

          var accent = localStorage.getItem("color");
          if (accent && CSS.supports("color", accent)) {
            document.documentElement.style.setProperty("--primary-color", accent);
          }
        } catch (e) {
          /* private mode - fall through to the light default */
        }
      })();
    </script>
